server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
          routes:
            - id: iam-service-authentication
              uri: ${IAM_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/authentication, /api/v1/authentication/**
            - id: iam-service-users
              uri: ${IAM_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/users, /api/v1/users/**
            - id: iam-service-profiles
              uri: ${IAM_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/profiles, /api/v1/profiles/**
            - id: inventory-service-supplies
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/supplies, /api/v1/supplies/**
            - id: operations-service-tables
              uri: ${OPERATIONS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/tables, /api/v1/tables/**
            - id: operations-service-comandas
              uri: ${OPERATIONS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/comandas, /api/v1/comandas/**
            - id: operations-service-sensors
              uri: ${OPERATIONS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/sensors, /api/v1/sensors/**
            - id: operations-service-restaurant-alerts
              uri: ${OPERATIONS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/restaurant/alerts, /api/v1/restaurant/alerts/**
            - id: operations-service-supplier-alerts
              uri: ${OPERATIONS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/supplier/alerts, /api/v1/supplier/alerts/**
            - id: purchasing-service-suppliers
              uri: ${PURCHASING_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/suppliers, /api/v1/suppliers/**
            - id: purchasing-service-purchase-orders
              uri: ${PURCHASING_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/purchase-orders, /api/v1/purchase-orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

authorization:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-change-me-12345678901234567890}

